name: refresh

# Pull Meta + Hyros, rebuild the dashboard, deploy it to GitHub Pages.
# The two API credentials live only in Actions Secrets (FB_TOKEN, HYROS_API_KEY);
# they reach the scripts as environment variables and never touch the repo or the
# published page. Both are read-only keys.

on:
  schedule:
    # Twice an hour, on minutes nobody else uses.
    #
    # This was "8 * * * *" and GitHub kept dropping it. Over the 200 runs to
    # 2026-08-27 the median gap held at 0.96h but 6% of gaps ran past 1.9h, every
    # night showed the same ~2.3h hole around 23:30 UTC, and the night of 08-26
    # lost 10.2 hours outright (23:25Z straight to 09:34Z). Scheduled runs on
    # public repos are best-effort and are shed under load, and load peaks on the
    # first minutes of the hour, where nearly every cron in the world is pointed.
    #
    # So: off the top of the hour, and twice as many chances to land. This does
    # not make the schedule reliable, because nothing can. The page's own Refresh
    # button, which pulls live in the reader's browser, is what makes staleness
    # optional; this only shortens it for a reader who has no keys.
    - cron: "17,47 * * * *"
  workflow_dispatch: {} # run-on-demand from the Actions tab or the GitHub app
  push:
    branches: [main]
    paths:
      - pull.py
      - live.js
      - live.html
      - build.py
      - hyros_seed.json
      - fonts/**
      - brand/**
      - robots.txt
      - .github/workflows/refresh.yml

permissions:
  contents: write # keepalive commit only; the site itself deploys via Pages
  pages: write
  id-token: write

# One refresh at a time, and never cancel a deploy mid-flight.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A throttled Graph call can back off for ~13 minutes. This is the ceiling on how
    # long a bad hour may hold the `refresh` concurrency group against the next run.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Downscaled ad creatives, carried between runs so only new ads download.
      - uses: actions/cache@v4
        with:
          path: creative-cache
          key: creative-cache-${{ github.run_id }}
          restore-keys: |
            creative-cache-

      - name: Pull Meta + Hyros
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          HYROS_API_KEY: ${{ secrets.HYROS_API_KEY }}
        run: python pull.py

      - name: Build the page
        run: python build.py

      - name: Assemble the site
        run: mkdir -p _site && cp index.html robots.txt live.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages returns a 503 "No server is currently available" during GitHub incidents,
      # which failed two runs during the 2026-08-17 partial outage and left the published
      # page an hour stale each time. The data is already built by this point, so retry
      # the deploy rather than throwing the run away.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry the deploy if Pages was unavailable
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Second retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 180

      - id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report a deploy that only succeeded on retry
        if: steps.deployment.outcome == 'failure'
        run: echo "::warning::Pages deploy failed on the first attempt and succeeded on retry; check githubstatus.com if this repeats."

      # GitHub disables cron schedules in repos with no commit activity for 60 days.
      # An empty commit every ~50 days keeps the hourly refresh alive forever.
      - name: Keep the schedule alive
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the hourly schedule alive"
            git push
          fi
